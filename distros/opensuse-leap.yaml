name: "openSUSE Leap 16.0"
# "current" policy: undated Cloud.qcow2 alias + a one-line .sha256 next to it.
# NOTE: download.opensuse.org redirects to mirrors (build.sh uses curl -L).
url: "https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2"
sums_url: "https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2.sha256"
cs_ostype: "SUSE Linux Enterprise Server 15 (64-bit)"  # CloudStack 4.22 has no openSUSE Leap type — closest from the SUSE family
epel: false
# Minimal-VM has no room for our packages with a disk resize alone
# ("installing package python313-base needs 22MB more space"), and upstream does
# not publish a bigger variant for Leap 16.0. So its root is grown already at build
# time. Rocky 10 broke on the same operation (the initramfs could not find root by
# UUID), which is why this is an option and not the default.
grow_root_at_build: true
disk_size: "10G"
packages:
  - qemu-guest-agent  # the image already has 10.x, install = no-op/upgrade
  - fail2ban          # in the main oss repo of Leap 16.0 (NOT in 15.6)
  - python3-systemd   # backend=systemd in jail.local
  - chrony
  - curl
  - jq
  - python3
  - dhcp-client       # ISC dhclient for cloud-init (NetworkManager stays on dhcp=internal)
# Instances from this template could not be reached over SSH in CloudStack.
# cloud-init 25.1.3 in `DataSourceCloudStack._get_domainname()` uses
# `distro.dhcp_client`, and by default picks `dhcpcd` (first in its code), which
# nobody runs — the network is managed by NetworkManager. `dhcpcd --dumplease` fails
# with "dhcpcd is not running", `NoDHCPLeaseError` is not caught and aborts the WHOLE
# init stage: no SSH keys, user-data or password. Fixed upstream in 26.1 (#6554);
# Leap 16.0 ships 25.1.3 without the fix. The `dhcp-client` package alone is NOT
# enough — dhcpcd still wins by order — hence an explicit priority. dhclient without
# a lease returns `{}`, so the init stage passes. It does not bring in the router
# address from the lease: 25.1.3 has no `DataSourceCloudStackLocal`, the datasource is
# detected only in init-network, where `data-server` resolves to the VIP.
# Verified with a full `cloud-init init` on a copy of the artifact: before = init stage
# FAILED, after = SUCCESS and "Found metadata server ... via data-server DNS entry".
cloudinit_dhcp_client_priority: [dhclient]
