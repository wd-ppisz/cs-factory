# cs-factory: /dev/watchdog is petted by PID1 (no extra daemon).
# CloudStack KVM (>=4.11) adds an i6300esb watchdog device to every VM's XML; the
# i6300esb module loads by PCI ID. The timer is INACTIVE until the guest arms it —
# this configuration does exactly that (systemd opens /dev/watchdog and pets it at
# half the interval; on a clean shutdown it disarms via magic-close).
# NOTE: the hypervisor-side action is vm.watchdog.action in the host's
# agent.properties (DEFAULT: none — nothing happens). A reset on hang requires
# vm.watchdog.action=reset on the hosts + a cloudstack-agent restart.
# On a VM without a watchdog device this is harmless (systemd logs and carries on).
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
