# cs-factory — datasource for CloudStack (advanced zone with a Virtual Router).
# CloudStack FIRST: the VR is authoritative for user-data (prevents ConfigDrive/None
# from taking over and silently yielding empty user-data).
# 'None' deliberately OMITTED: a missing datasource must fail loudly (cloud-init
# retries), not silently inject empty user-data.
datasource_list: [ CloudStack, ConfigDrive ]
datasource:
  CloudStack: {}

# Disk size: the factory grows ONLY the disk (the partition table is not touched —
# virt-resize renumbered partitions and broke GRUB: "no such partition" on 5 of 9
# distributions). The root partition and filesystem are grown by cloud-init on first
# boot. This is set EXPLICITLY instead of relying on the defaults of nine different
# distributions — the same class of assumption ("the module will load by itself")
# already bit us with the watchdog on Debian 12.
growpart:
  mode: auto
  devices: [ / ]
  ignore_growroot_disabled: false
resize_rootfs: true
