# cs-factory: GUI (proxy to gunicorn) + artifacts (qcow2 for register.sh / SSVM).
# Bind to a management network address and put TLS + SSO in front of it
# (reverse proxy / edge). Adjust `listen` and `server_name` to your site.
server {
    listen 80;
    server_name factory.example.com;

    # Artifacts = images that PASSED the validation gate (published by
    # `make publish` from CI and by local builds from the GUI). The CloudStack
    # SSVM downloads the image from here when a template is registered - hence
    # no SSO on this location (restrict access at the network level instead).
    location /artifacts/ {
        alias /srv/cs-factory/artifacts/;
        autoindex on;
    }

    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
